[project]
name = "telegram-father"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed-Almakki", email = "ahmedlmakkii@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "cryptg>=0.6.1",
    "dotenv>=0.9.9",
    "pillow>=13.0.0",
    "playwright>=1.65.2",
    "pytest-playwright>=0.10.0",
    "selenium>=4.30.0",
    "telethon>=1.46.0",
]

[project.scripts]
telegram-father = "telegram_father:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
